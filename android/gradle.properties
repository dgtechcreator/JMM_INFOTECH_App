org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
# Works around a Kotlin Build Tools API bug on Windows where compileDebugKotlin tasks for different
# plugin modules (image_picker_android, shared_preferences_android) collide over shared incremental-cache
# storage files ("already registered" / "Could not close incremental caches"), reliably failing every
# build. Disabling incremental Kotlin compilation avoids that broken code path; only cost is a full
# (not incremental) Kotlin recompile each time, which doesn't matter for a debug APK build.
kotlin.incremental=false
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
